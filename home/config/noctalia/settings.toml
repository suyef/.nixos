config_version = 13

[bar.default]
background_opacity = 0.45
center = [ "clock", "wallpaper" ]
font_family = "Cantarell"
font_weight = 400
margin_edge = 1
margin_ends = 90
margin_opposite_edge = 1
position = "bottom"
shadow = false
start = [ "launcher", "workspaces" ]
thickness = 35

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1077.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        center_password_text = false
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
temperature_day = 5500

[notification]
background_opacity = 0.39999999105930328
scale = 0.85000000521540642

[shell]
app_icon_color = "primary"
font_family = "Cantarell"
settings_show_advanced = true

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "bottom_right"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

[theme]
builtin = "Ayu"
community_palette = "Murata"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "alacritty", "foot", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "zen-browser", "neovim", "vicinae" ]

[wallpaper]
directory = "/home/suyef/Pictures"

    [wallpaper.default]
    path = "/home/suyef/Pictures/wallpapers/manga/wallhaven-3qwzpy.png"

    [wallpaper.last]
    path = "/home/suyef/Pictures/wallpapers/manga/wallhaven-3qwzpy.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/suyef/Pictures/wallpapers/manga/wallhaven-3qwzpy.png"

[widget.control-center]
glyph = "settings"

[widget.workspaces]
empty_color = "surface"
label_source = "name"
minimal = true
occupied_color = "on_surface"
scale = 1
style = "minimal"
