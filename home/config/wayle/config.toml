[general]
font-sans = "Cantarell"
font-mono = "Iosevka Nerd Font Propo"
[bar]
scale = 0.65
location = "bottom"
bg = "bg-base"
button-variant = "basic"
button-label-size = 1.2
button-rounding = "none"

[[bar.layout]]
monitor = "*"
show = true
left = [
    "hyprland-workspaces",
    "media",
    "cava",
]
center = ["clock"]
right = [
    "weather",
    "battery",
    "bluetooth",
    "network",
    "microphone",
    "volume",
    "systray",
    "dashboard",
]
[styling.palette]
bg = "#1d2021"
surface = "#282828"
elevated = "#32302f"
fg = "#ebdbb2"
fg-muted = "#a89984"
primary = "#d4be98"
red = "#fb4934"
yellow = "#fabd2f"
green = "#b8bb26"
blue = "#83a598"

[modules.notification]
popup-position = "bottom-right"

[wallpaper]
engine-enabled = false 
